        ctx.restore();
      }
    } else if (type === 'P' && t >= 0.38 && t < 0.72) {
      const ep = (t - 0.38) / 0.34;
      ctx.save();
      ctx.translate(baseDefX, baseDefY);
      ctx.globalAlpha = 1 - ep;
      ctx.fillStyle = '#ffe066';
      ctx.beginPath();
      ctx.moveTo(-80, -14);
      ctx.lineTo(95 + ep * 40, -25);
      ctx.lineTo(-80, 14);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    if (t >= 0.43 && t <= 0.50) {
      const flashAlpha = Math.sin(((t - 0.43) / 0.07) * Math.PI) * 0.55;
      ctx.fillStyle = `rgba(255, 245, 210, ${flashAlpha})`;
      ctx.fillRect(stageX, stageY, stageW, stageH);
    }

    ctx.restore(); // 結束舞台內部 clip

    roundRect(ctx, stageX, stageY, stageW, stageH, 20);
    ctx.lineWidth = 4.5;
    ctx.strokeStyle = '#ebc060';
    ctx.stroke();

    const bannerW = 340, bannerH = 46;
    const bannerX = (LOGICAL_W - bannerW) / 2;
    const bannerY = stageY + stageH - 28;
    roundRect(ctx, bannerX, bannerY, bannerW, bannerH, 23);
    ctx.fillStyle = '#140b21';
    ctx.fill();
    ctx.lineWidth = 3;
    ctx.strokeStyle = '#ffd866';
    ctx.stroke();

    ctx.fillStyle = '#ffd866';
    ctx.font = 'bold 22px "PingFang TC", "Microsoft JhengHei", serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(b.title, LOGICAL_W / 2, bannerY + bannerH / 2 + 1);

    ctx.restore();

    if (b.deathStyle === 'SCREEN_FLY' && t >= 0.44) {
      const flyP = (t - 0.44) / 0.56;
      const flyAlpha = flyP > 0.76 ? Math.max(0, 1 - (flyP - 0.76) / 0.24) : 1.0;
      drawPiece(b.defFlyX, b.defFlyY, b.defender, b.defScale, flyAlpha, b.defRot, false, 0);
    }

    ctx.restore();
  }

  // 繪製附圖同款「黑曜石 × 珍珠白 × 皇家金邊」8x8 國際象棋盤
  function drawBoard() {
    const pad = 24;
    // 棋盤底層立體陰影
    roundRect(ctx, BOARD_LEFT - pad, BOARD_TOP - pad + 8, BOARD_W + pad * 2, BOARD_H + pad * 2, 18);
    ctx.fillStyle = 'rgba(0, 0, 0, 0.72)';
    ctx.fill();

    // 巴洛克黑金邊框
    roundRect(ctx, BOARD_LEFT - pad, BOARD_TOP - pad, BOARD_W + pad * 2, BOARD_H + pad * 2, 18);
    const frameGrad = ctx.createLinearGradient(0, BOARD_TOP - pad, 0, BOARD_TOP + BOARD_H + pad);
    frameGrad.addColorStop(0, '#2c1d3d');
    frameGrad.addColorStop(0.5, '#191024');
    frameGrad.addColorStop(1, '#110a1a');
    ctx.fillStyle = frameGrad;
    ctx.fill();

    ctx.lineWidth = 3.5;
    ctx.strokeStyle = '#ebc060';
    ctx.stroke();

    // 內圈金線裝飾
    ctx.strokeStyle = 'rgba(235, 192, 96, 0.65)';
    ctx.lineWidth = 2;
    ctx.strokeRect(BOARD_LEFT - 3, BOARD_TOP - 3, BOARD_W + 6, BOARD_H + 6);

    // 繪製 8x8 皇家胡桃木 × 暖米白大理石交錯方格 (讓「珍珠白金棋子」與「暗夜紫黑棋子」在深淺格都擁有極佳對比度！)
    for (let r = 0; r < BOARD_ROWS; r++) {
      for (let c = 0; c < BOARD_COLS; c++) {
        const sx = BOARD_LEFT + c * CELL_SIZE;
        const sy = BOARD_TOP + r * CELL_SIZE;
        const isLight = (r + c) % 2 === 0;

        if (isLight) {
          const sqGrad = ctx.createLinearGradient(sx, sy, sx + CELL_SIZE, sy + CELL_SIZE);
          sqGrad.addColorStop(0, '#eadbcf');
          sqGrad.addColorStop(1, '#d8c3b0');
          ctx.fillStyle = sqGrad;
        } else {
          const sqGrad = ctx.createLinearGradient(sx, sy, sx + CELL_SIZE, sy + CELL_SIZE);
          sqGrad.addColorStop(0, '#6e5243');
          sqGrad.addColorStop(1, '#543c30');
          ctx.fillStyle = sqGrad;
        }
        ctx.fillRect(sx, sy, CELL_SIZE, CELL_SIZE);

        // 中央 4x4 格子繪製附圖展示台同款淡金色西洋棋浮水印
        if (r >= 2 && r <= 5 && c >= 2 && c <= 5 && (r + c) % 2 === 1) {
          ctx.save();
          ctx.fillStyle = 'rgba(255, 225, 130, 0.10)';
          ctx.font = '26px serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText((r + c) % 4 === 1 ? '♛' : '♞', sx + CELL_SIZE / 2, sy + CELL_SIZE / 2);
          ctx.restore();
        }
      }
    }

    // 棋盤座標標記 (A~H 與 8~1)
    ctx.fillStyle = '#ebc060';
    ctx.font = 'bold 12px "PingFang TC", sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const files = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H'];
    for (let c = 0; c < 8; c++) {
      const cx = BOARD_LEFT + (c + 0.5) * CELL_SIZE;
      ctx.fillText(files[c], cx, BOARD_TOP + BOARD_H + 13);
      ctx.fillText(files[c], cx, BOARD_TOP - 13);
    }
    for (let r = 0; r < 8; r++) {
      const cy = BOARD_TOP + (r + 0.5) * CELL_SIZE;
      const rankLabel = String(8 - r);
      ctx.fillText(rankLabel, BOARD_LEFT - 13, cy);
      ctx.fillText(rankLabel, BOARD_LEFT + BOARD_W + 13, cy);
    }

    // 上一步移動軌跡高亮框
    if (state.lastMove) {
      const fPos = gridToPixel(state.lastMove.fr, state.lastMove.fc);
      const tPos = gridToPixel(state.lastMove.tr, state.lastMove.tc);
      ctx.fillStyle = 'rgba(245, 197, 66, 0.25)';
      ctx.fillRect(fPos.x - CELL_SIZE / 2, fPos.y - CELL_SIZE / 2, CELL_SIZE, CELL_SIZE);
      ctx.fillRect(tPos.x - CELL_SIZE / 2, tPos.y - CELL_SIZE / 2, CELL_SIZE, CELL_SIZE);
      ctx.strokeStyle = 'rgba(245, 197, 66, 0.85)';
      ctx.lineWidth = 2.5;
      ctx.strokeRect(tPos.x - CELL_SIZE / 2 + 2, tPos.y - CELL_SIZE / 2 + 2, CELL_SIZE - 4, CELL_SIZE - 4);
    }
  }

  function renderPlaying() {
    // 頂部皇家資訊面板 (針對 iPhone 13 / 17 Pro Max 雙欄防重疊自適應排版)
    roundRect(ctx, 18, 12, LOGICAL_W - 36, 154, 16);
    const topGrad = ctx.createLinearGradient(0, 12, 0, 166);
    topGrad.addColorStop(0, '#2a1b3d');
    topGrad.addColorStop(1, '#170e24');
    ctx.fillStyle = topGrad;
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = '#ebc060';
    ctx.stroke();

    // 第一列：左側標題 + 右側雙功能按鈕（嚴格限制寬度不碰撞）
    drawFitText('楚漢演武 · FIDE 皇家西洋棋', 30, 36, 268, 20, 'left', '#ffd866', true);

    // FIDE 摸子走子規則 (Touch-Move) 切換按鈕
    drawButton({
      x: LOGICAL_W - 218,
      y: 20,
      w: 106,
      h: 34,
      r: 8,
      label: state.touchPieceRule ? '✋ 摸子走子:開' : '✋ 摸子走子:關',
      fontSize: 12.5,
      bg1: state.touchPieceRule ? '#b45309' : '#3b2154',
      bg2: state.touchPieceRule ? '#78350f' : '#201030',
      action: 'TOGGLE_TOUCH_RULE'
    });

    drawButton({
      x: LOGICAL_W - 104,
      y: 20,
      w: 76,
      h: 34,
      r: 8,
      label: sfx.muted ? '🔇 靜音' : '🔊 音效',
      fontSize: 13.5,
      bg1: '#3b2154',
      bg2: '#201030'
    });

    // 第二列：FIDE 雙陣營計時鐘 + 回合/50步規則（三欄平均分配寬度）
    const wClockStr = `⏱️白方 ${formatChessClock(state.whiteTime)}`;
    const bClockStr = `⏱️黑方 ${formatChessClock(state.blackTime)}`;
    drawFitText(wClockStr, 30, 68, 125, 14, 'left', state.turn === SIDE_RED ? '#fde047' : '#cbd5e1', true);
    drawFitText(bClockStr, 162, 68, 125, 14, 'left', state.turn === SIDE_BLACK ? '#d8b4fe' : '#cbd5e1', true);
    drawFitText(`第 ${state.turnCount} 回合 | 50步:${Math.floor(state.halfMoveClock / 2)}/50`, LOGICAL_W - 28, 68, 210, 13.5, 'right', '#f5e6c8', true);

    // 第三列：目前行棋方提示 + 右側取消選取按鈕
    const turnText = state.aiThinking
      ? '暗夜紫黑（電腦）思考樂章中...'
      : (state.turn === SIDE_RED ? '輪到：聖光白金（白方）出招' : '輪到：暗夜紫黑（黑方）出招');
    drawFitText(turnText, 30, 98, state.selected && !state.touchPieceRule ? 360 : 480, 15, 'left', state.turn === SIDE_RED ? '#fde68a' : '#d8b4fe', true);

    if (state.selected && !state.touchPieceRule) {
      drawButton({
        x: LOGICAL_W - 126,
        y: 82,
        w: 98,
        h: 32,
        r: 8,
        label: '✖ 取消選取',
        fontSize: 13,
        bg1: '#78350f',
        bg2: '#451a03',
        action: 'DESELECT'
      });
    }

    // 第四列：最新 FIDE SAN 代數記譜紀錄（獨立一行，絕不與已選棋子名稱重疊）
    const recentSAN = state.moveNotations.slice(-5).map((s, idx) => {
      const ply = state.moveNotations.length - Math.min(5, state.moveNotations.length) + idx;
      const moveNum = Math.floor(ply / 2) + 1;
      return ply % 2 === 0 ? `${moveNum}.${s}` : s;
    }).join(' ');
    drawFitText(`棋譜(SAN)：${recentSAN || '開局準備中 (白方先手)'}`, 30, 126, 480, 13, 'left', '#c4b5fd', false);

    // 第五列：顯示當前選中棋子稱號或操作提示
    if (state.selected) {
      const sp = state.board[state.selected.r][state.selected.c];
      if (sp) {
        const selInfo = state.touchPieceRule
          ? `🔒 FIDE 摸子鎖定：【${PIECE_NAMES[sp.type]}】${PIECE_TITLES[sp.type]}`
          : `✨ 已選取：【${PIECE_NAMES[sp.type]}】${PIECE_TITLES[sp.type]}`;
        drawFitText(selInfo, 30, 149, 480, 13, 'left', '#ffd866', true);
      }
    } else {
      drawFitText('💡 點擊己方棋子顯示合法落點（支援王車易位、過路兵、底線升變）', 30, 149, 480, 12.5, 'left', '#a78bfa', false);
    }

    drawBoard();

    // 由上至下繪製 8x8 棋盤上的 3D 庫洛米西洋棋公仔
    for (let r = 0; r < BOARD_ROWS; r++) {
      for (let c = 0; c < BOARD_COLS; c++) {
        const p = state.board[r][c];
        if (!p) continue;
        const pos = gridToPixel(r, c);
        const isSel = state.selected && state.selected.r === r && state.selected.c === c;
        drawPiece(pos.x, pos.y, p, 1, 1, 0, isSel, 0);
      }
    }

    // 在最上層繪製合法移動指標（支援一般移動、吃子、王車易位、吃過路兵標示）
    for (const m of state.legalMoves) {
      const pos = gridToPixel(m.tr, m.tc);
      const target = state.board[m.tr][m.tc] || (m.isEnPassant ? true : null);
      if (target) {
        ctx.save();
        ctx.translate(pos.x, pos.y);
        ctx.beginPath();
        ctx.arc(0, 0, 24, 0, Math.PI * 2);

  // =========================================================================
  // 6. 遊戲主迴圈與動畫更新 (完整物理與粒子更新 + Canvas 獨立渲染)
  // =========================================================================
  let lastTime = performance.now();

  function update(dt) {
    state.animClock += dt;
    if (state.warningLine && state.warningLine.timer > 0) {
      state.warningLine.timer = Math.max(0, state.warningLine.timer - dt);
    }

    // FIDE 比賽計時鐘倒數與超時判負 (Flag Fall)
    if (state.screen === 'PLAYING' && !state.moveAnim && !state.battleAnim && !state.pendingPromotion) {
      if (state.turn === SIDE_RED) {
        state.whiteTime = Math.max(0, state.whiteTime - dt);
        if (state.whiteTime <= 0) {
          state.winner = SIDE_BLACK;
          state.winReason = 'FIDE 規則：白方思考時間耗盡（超時判負），暗夜紫黑獲勝！';
          sfx.playLose();
          state.screen = 'GAMEOVER';
        }
      } else {
        state.blackTime = Math.max(0, state.blackTime - dt);
        if (state.blackTime <= 0) {
          state.winner = SIDE_RED;
          state.winReason = 'FIDE 規則：黑方思考時間耗盡（超時判負），聖光白金獲勝！';
          sfx.playWin();
          state.screen = 'GAMEOVER';
        }
      }
    }

    if (state.screenShake > 0) {
      state.screenShake = Math.max(0, state.screenShake - dt * 35);
    }

    if (state.moveAnim) {
      state.moveAnim.progress += dt / state.moveAnim.duration;
      if (state.moveAnim.progress >= 1) {
        const { move, piece } = state.moveAnim;
        state.moveAnim = null;
        finalizeMove(move, piece, null);
      }
    }

    if (state.battleAnim) {
      const b = state.battleAnim;
      b.progress += dt / b.duration;

      if (b.progress >= 0.44 && !b.hitTriggered) {
        b.hitTriggered = true;
        state.screenShake = (b.deathStyle === 'FLATTEN' || b.deathStyle === 'KICK_FLY') ? 18 : 13;
        const hitX = 392, hitY = 472;

        if (b.deathStyle === 'ASH') {
          spawnParticles(hitX, hitY, '#c084fc', 34, 7.5);
          spawnAshParticles(hitX, hitY, 85);
        } else if (b.deathStyle === 'FLATTEN') {
          spawnParticles(hitX, hitY + 28, '#cbd5e1', 38, 8.5);
          spawnParticles(hitX, hitY + 28, '#fbbf24', 26, 7.0);
        } else if (b.deathStyle === 'ROYAL_BLAST') {
          spawnParticles(hitX, hitY, '#ffd43b', 45, 8.0);
          spawnParticles(hitX, hitY, '#fff9c4', 28, 5.5);
        } else if (b.deathStyle === 'SLASH_SPLIT') {
          spawnParticles(hitX, hitY, '#ffe066', 34, 8.0);
          spawnParticles(hitX, hitY, '#f472b6', 20, 5.5);
        } else if (b.deathStyle === 'KICK_FLY') {
          spawnParticles(hitX - 16, hitY, '#ffe066', 38, 9.0);
          spawnParticles(hitX - 16, hitY, '#fb7185', 22, 6.5);
        } else {
          const color = b.attacker.side === SIDE_RED ? '#ffd43b' : '#c084fc';
          spawnParticles(hitX, hitY, color, 32, 7.5);
        }
      }

      if (b.progress >= 1) {
        const { move, attacker, defender } = b;
        state.battleAnim = null;
        finalizeMove(move, attacker, defender);
      }
    }

    if (state.aiThinking && !state.moveAnim && !state.battleAnim && !state.pendingPromotion && state.screen === 'PLAYING') {
      state.aiTimer -= dt;
      if (state.aiTimer <= 0) {
        state.aiThinking = false;
        const aiMove = getBestAIMove(state.board, state.difficulty);
        if (aiMove) {
          executeMove(aiMove);
        }
      }
    }

    for (let i = state.particles.length - 1; i >= 0; i--) {
      const p = state.particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.18;
      p.life -= p.decay;
      if (p.life <= 0) state.particles.splice(i, 1);
    }

    for (let i = state.ashParticles.length - 1; i >= 0; i--) {
      const ap = state.ashParticles[i];
      ap.wobble += 0.14;
      ap.x += ap.vx + Math.sin(ap.wobble) * 0.85;
      ap.y += ap.vy;
      ap.life -= ap.decay;
      if (ap.life <= 0) state.ashParticles.splice(i, 1);
    }

    for (let i = state.floatingTexts.length - 1; i >= 0; i--) {
      const ft = state.floatingTexts[i];
      ft.y += ft.vy;
      ft.life -= ft.decay;
      if (ft.life <= 0) state.floatingTexts.splice(i, 1);
    }
  }

  function render() {
    state.uiButtons = [];
    ctx.save();
    ctx.clearRect(0, 0, LOGICAL_W, LOGICAL_H);

    ctx.fillStyle = '#14101c';
    ctx.fillRect(0, 0, LOGICAL_W, LOGICAL_H);

    if (state.screenShake > 0) {
      const sx = (Math.random() - 0.5) * state.screenShake;
      const sy = (Math.random() - 0.5) * state.screenShake;
      ctx.translate(sx, sy);
    }

    if (state.screen === 'MENU') {
      renderMenu();
    } else if (state.screen === 'HELP') {
      renderHelp();
    } else if (state.screen === 'PLAYING' || state.screen === 'GAMEOVER') {
      renderPlaying();
      if (state.screen === 'GAMEOVER') {
        renderGameOverOverlay();
      }
    }

    for (const ap of state.ashParticles) {
      ctx.save();
      ctx.globalAlpha = Math.max(0, ap.life);
      ctx.fillStyle = `rgb(${ap.shade}, ${ap.shade}, ${ap.shade})`;
      ctx.beginPath();
      ctx.ellipse(ap.x, ap.y, ap.size, ap.size * 0.6, ap.wobble, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    for (const p of state.particles) {
      ctx.save();
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    for (const ft of state.floatingTexts) {
      ctx.save();
      ctx.globalAlpha = Math.max(0, ft.life);
      ctx.font = `bold ${ft.size}px -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", sans-serif`;
      ctx.textAlign = 'center';
      ctx.strokeStyle = '#12081f';
      ctx.lineWidth = 4;
      ctx.strokeText(ft.text, ft.x, ft.y);
      ctx.fillStyle = ft.color;
      ctx.fillText(ft.text, ft.x, ft.y);
      ctx.restore();
    }

    ctx.restore();
  }

  function loop(now) {
    const dt = Math.min(0.05, (now - lastTime) / 1000);
    lastTime = now;
    update(dt);
    render();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  // =========================================================================
  // 7. Pointer 觸控與滑鼠點擊事件處理
  // =========================================================================
  function getLogicalPoint(e) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = LOGICAL_W / rect.width;
    const scaleY = LOGICAL_H / rect.height;
    return {
      x: (e.clientX - rect.left) * scaleX,
      y: (e.clientY - rect.top) * scaleY
    };
  }

  canvas.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    sfx.unlock();
    const pt = getLogicalPoint(e);

    for (let i = state.uiButtons.length - 1; i >= 0; i--) {
      const btn = state.uiButtons[i];
      if (pt.x >= btn.x && pt.x <= btn.x + btn.w && pt.y >= btn.y && pt.y <= btn.y + btn.h) {
        if (btn.label.includes('音效') || btn.action === 'MUTE') {
          sfx.toggleMute();
          if (!sfx.muted) sfx.playSelect();
          return;
        }
        if (btn.action && btn.action.startsWith('PROMOTE_') && state.pendingPromotion) {
          const chosenType = btn.action.replace('PROMOTE_', '');
          const move = { ...state.pendingPromotion.move, promotion: chosenType };
          state.pendingPromotion = null;
          executeMove(move);
          return;
        }
        if (btn.action === 'TOGGLE_TOUCH_RULE') {
          state.touchPieceRule = !state.touchPieceRule;
          if (!state.touchPieceRule) {
            state.lockedPiecePos = null;
          } else if (state.selected && state.legalMoves.length > 0) {
            state.lockedPiecePos = { ...state.selected };
          }
          sfx.playSelect();
          return;
        }
        if (btn.action === 'DESELECT') {
          if (state.touchPieceRule && state.lockedPiecePos) {
            sfx.playInvalid();
            spawnFloatingText(LOGICAL_W / 2, 185, '⚠️ FIDE 摸子走子規則已開啟：觸摸後必須移動該棋子！', '#fde047', 16);
            return;
          }
          state.selected = null;
          state.legalMoves = [];
          state.blockedMoves = [];
          state.warningLine = null;
          sfx.playCancel();
          return;
        }
        sfx.playSelect();
        if (btn.action === 'START_NORMAL') resetGame('AI', 'normal');
        else if (btn.action === 'START_HARD') resetGame('AI', 'hard');
        else if (btn.action === 'START_PVP') resetGame('PVP', 'normal');
        else if (btn.action === 'HELP') state.screen = 'HELP';
        else if (btn.action === 'MENU') state.screen = 'MENU';
        else if (btn.action === 'RESTART') resetGame(state.mode, state.difficulty);
        else if (btn.action === 'UNDO') handleUndo();
        return;
      }
    }

    if (state.screen !== 'PLAYING') return;
    if (state.moveAnim || state.battleAnim || state.aiThinking || state.pendingPromotion) return;
    if (state.mode === 'AI' && state.turn !== SIDE_RED) return;

    const cell = pixelToGrid(pt.x, pt.y);

    if (!cell) {
      if (state.selected) {
        if (state.touchPieceRule && state.lockedPiecePos) {
          sfx.playInvalid();
          spawnFloatingText(LOGICAL_W / 2, 185, '⚠️ FIDE 摸子走子規則：該棋子有合法步，不可取消選取！', '#fde047', 16);
          return;
        }
        state.selected = null;
        state.legalMoves = [];
        state.blockedMoves = [];
        state.warningLine = null;
        sfx.playCancel();
      }
      return;
    }

    if (state.selected) {
      if (state.selected.r === cell.r && state.selected.c === cell.c) {
        if (state.touchPieceRule && state.lockedPiecePos) {
          sfx.playInvalid();
          spawnFloatingText(LOGICAL_W / 2, 185, '⚠️ FIDE 摸子走子規則：已觸摸此棋子，請選擇綠色落點行棋！', '#fde047', 16);
          return;
        }
        state.selected = null;
        state.legalMoves = [];
        state.blockedMoves = [];
        state.warningLine = null;
        sfx.playCancel();
        return;
      }

      const chosenMove = state.legalMoves.find(m => m.tr === cell.r && m.tc === cell.c);
      if (chosenMove) {
        // 若是玩家士兵抵達底線，彈出 FIDE 升變四選一視窗 (皇后/城堡/主教/騎士)
        if (chosenMove.needsPromotionChoice) {
          state.pendingPromotion = {
            move: chosenMove,
            side: state.turn
          };
          sfx.playSelect();
          return;
        }
        executeMove(chosenMove);
        return;
      }

      const pinnedMove = (state.blockedMoves || []).find(m => m.tr === cell.r && m.tc === cell.c);
      if (pinnedMove && pinnedMove.exposure) {
        sfx.playInvalid();
        const pos = gridToPixel(cell.r, cell.c);
        spawnFloatingText(LOGICAL_W / 2, pos.y - 24, pinnedMove.exposure.text, '#ff4d6d', 17);
        state.warningLine = {
          from: pinnedMove.exposure.threatPos,
          to: pinnedMove.exposure.kingPos,
          timer: 2.2
        };
        return;
      }
    }

    const clickedPiece = state.board[cell.r][cell.c];
    if (clickedPiece && clickedPiece.side === state.turn) {
      // 若開啟 FIDE 摸子走子規則且已鎖定另一顆具有合法步的棋子，禁止切換選取別顆棋子
      if (
        state.touchPieceRule &&
        state.lockedPiecePos &&
        (state.lockedPiecePos.r !== cell.r || state.lockedPiecePos.c !== cell.c)
      ) {
        const lockedP = state.board[state.lockedPiecePos.r][state.lockedPiecePos.c];
        const lockedName = lockedP ? PIECE_NAMES[lockedP.type] : '原棋子';
        sfx.playInvalid();
        spawnFloatingText(LOGICAL_W / 2, 185, `⚠️ FIDE 摸子走子：您已觸摸【${lockedName}】，必須走該棋子！`, '#fde047', 16);
        return;
      }

      const moves = getLegalMovesForPiece(state.board, cell.r, cell.c, state.lastMove);
      state.selected = { r: cell.r, c: cell.c };
      state.legalMoves = moves;
      state.blockedMoves = getPinnedBlockedMoves(state.board, cell.r, cell.c);
      state.warningLine = null;
      if (state.touchPieceRule && moves.length > 0) {
        state.lockedPiecePos = { r: cell.r, c: cell.c };
      }
      sfx.playSelect();
    } else if (clickedPiece && clickedPiece.side !== state.turn) {
      sfx.playCancel();
      const pos = gridToPixel(cell.r, cell.c);
      if (state.selected) {
        spawnFloatingText(pos.x, pos.y - 24, '此位置目前無法吃子', '#ff8b9c', 16);
      } else {
        spawnFloatingText(pos.x, pos.y - 24, '敵方棋子不可選取', '#ff8b9c', 16);
      }
    } else if (state.selected) {
      if (state.touchPieceRule && state.lockedPiecePos) {
        sfx.playInvalid();
        spawnFloatingText(LOGICAL_W / 2, 185, '⚠️ FIDE 摸子走子規則：不可取消已觸摸且可移動的棋子！', '#fde047', 16);
        return;
      }
      state.selected = null;
      state.legalMoves = [];
      state.blockedMoves = [];
      state.warningLine = null;
      sfx.playCancel();
    }
  });
})();
</script>
